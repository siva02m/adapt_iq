spring.application.name=learning-platform

# PostgreSQL Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/adaptive_learning
spring.datasource.username=postgres
spring.datasource.password=password

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Secret must be at least 256 bits (32 chars) for HS256 — change this in production!
jwt.secret=AdaptIQ_SuperSecure_EnterpriseKey_32Chars!!
jwt.expiration-ms=86400000

# Disable Spring Security's default login page popup
spring.security.user.name=disabled
spring.security.user.password=disabled

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
